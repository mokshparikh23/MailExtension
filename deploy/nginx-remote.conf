# Nginx reverse proxy for the Internal Remote Control relay.
# Replace remote.example.com with your subdomain (e.g. remote.yourdomain.com),
# then let certbot add the TLS (443) server block automatically:
#   sudo certbot --nginx -d remote.yourdomain.com

server {
    listen 80;
    server_name remote.example.com;

    # Screen frames can be large (base64 PNGs).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket (Socket.IO) upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep long-lived sockets open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
