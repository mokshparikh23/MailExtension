<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Internal Remote Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand">
          <div class="mark">IR</div>
          <div>
            <h1>Internal Remote Control</h1>
            <p id="streamInfo">Connect a device to start viewing</p>
          </div>
        </div>
        <div class="top-actions">
          <div id="status" class="status">Disconnected</div>
          <button id="wakeBtn" class="ghost" type="button">Wake Laptop B</button>
          <button id="settingsBtn" class="ghost" type="button" aria-controls="settingsPanel" aria-expanded="true">Settings</button>
        </div>
      </section>

      <section class="workspace">
        <div class="screen-column">
          <div class="screen-wrap">
            <div id="screenMeta" class="screen-meta">Size: 0 B | Type: -</div>
            <div id="deviceMeta" class="device-meta">Device: -, Version: -</div>
            <img id="screen" alt="Remote screen will appear after the agent connects" />
            <div id="empty">
              <div class="empty-icon">⌁</div>
              <strong>Waiting for paired device agent</strong>
              <span>Open Settings, connect to a room, and start the agent on Laptop B.</span>
            </div>
            <div class="screen-actions">
              <button id="fitBtn" class="ghost" type="button">Fill area (crop)</button>
              <button id="fullscreenBtn" class="ghost" type="button">Fullscreen</button>
            </div>
          </div>
        </div>

        <aside class="panel" id="settingsPanel">
          <div class="panel-heading">
            <strong>Settings</strong>
            <button id="closeSettingsBtn" class="ghost" type="button" aria-label="Close settings">✕</button>
          </div>
          <div class="setup">
            <label class="field">
              <span>Server token</span>
              <input id="token" type="password" autocomplete="off" placeholder="ACCESS_TOKEN" />
            </label>
            <label class="field">
              <span>Room ID</span>
              <input id="roomId" autocomplete="off" placeholder="test123" />
            </label>
            <button id="connectBtn" class="primary wide">Connect</button>
          </div>
          <div class="panel-section">
            <span class="eyebrow">Lab devices</span>
            <label class="field">
              <span>Choose a room</span>
              <select id="deviceList"><option value="">Refresh to load devices</option></select>
            </label>
            <button id="refreshDevicesBtn" class="ghost" type="button">Refresh devices</button>
          </div>
          <div class="panel-section">
            <span class="eyebrow">Session</span>
            <button id="screenBtn" class="primary wide">Get Screen</button>
          </div>

          <div class="panel-grid">
            <label class="field">
              <span>Refresh interval (ms)</span>
              <input id="interval" type="number" value="250" min="100" step="50" />
            </label>
            <label class="field">
              <span>JPEG quality</span>
              <input id="quality" type="number" value="60" min="10" max="90" />
            </label>
          </div>

          <div class="panel-section">
            <span class="eyebrow">Controls</span>
            <label class="switch">
              <input id="live" type="checkbox" checked />
              <span></span>
              <b>Live share</b>
            </label>
            <label class="switch">
              <input id="mouse" type="checkbox" checked />
              <span></span>
              <b>Enable mouse</b>
            </label>
            <label class="switch">
              <input id="keyboard" type="checkbox" />
              <span></span>
              <b>Enable keyboard</b>
            </label>
          </div>

          <div class="panel-section grow">
            <span class="eyebrow">Event log</span>
            <pre id="log"></pre>
          </div>
        </aside>
      </section>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
